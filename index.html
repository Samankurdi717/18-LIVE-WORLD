<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KURD STAR</title>
<script src="https://download.agora.io/sdk/release/AgoraRTC_N-4.24.8.js"></script>

<style>
*{box-sizing:border-box}
body{
 margin:0;padding:16px;
 background:#080808;color:white;
 font-family:Arial,sans-serif;text-align:center
}
.container{max-width:650px;margin:auto}
header{
 background:linear-gradient(145deg,#202020,#090909);
 border:1px solid #b58a28;border-radius:18px;
 padding:22px 12px;margin-bottom:16px
}
.flag{font-size:35px}
h1{color:#e8bd50;font-size:32px;margin:8px}
.tagline{color:#ddd;font-size:14px}
.live-badge{
 display:inline-block;background:#d71920;
 padding:5px 18px;border-radius:20px;
 font-weight:bold;margin-top:10px
}
.panel{
 background:#171717;border:1px solid #70551d;
 border-radius:16px;padding:18px;margin-bottom:15px
}
input[type=text]{
 width:100%;padding:14px;border-radius:10px;
 border:1px solid #b58a28;background:#080808;
 color:white;font-size:16px;margin:12px 0
}
button{
 padding:12px 16px;margin:5px;
 border:1px solid #c69b35;border-radius:10px;
 background:#b58a28;color:#080808;
 font-size:15px;font-weight:bold;cursor:pointer
}
button.dark{background:#252525;color:#f3ce69}
button.red{background:#a71922;color:white;border-color:#a71922}
button:active{opacity:.75}
#status{color:#f3ce69;overflow-wrap:anywhere}
.video{
 width:100%;height:240px;margin-top:12px;
 background:#050505;border:1px solid #70551d;
 border-radius:12px;overflow:hidden;position:relative
}
.video video{
 width:100%!important;height:100%!important;
 object-fit:cover!important
}
h2,h3{color:#e8bd50}
.footer{color:#999;font-size:12px;padding:12px}
</style>
</head>

<body>
<div class="container">

<header>
 <div class="flag">🇹🇯</div>
 <h1>⭐ KURD STAR ⭐</h1>
 <div class="tagline">لە کوردستانەوە بۆ هەموو جیهان</div>
 <div class="live-badge">● LIVE</div>
</header>

<div class="panel">
 <h2>بەخێربێیت بۆ KURD STAR</h2>
 <p>جیهانی لایڤ و پەیوەندی لەگەڵ خەڵکی جیهان</p>

 <label>
  <input type="checkbox" id="age" style="width:auto">
  من 18 ساڵ یان زیاترەم
 </label>

 <input type="text" id="channel" placeholder="ناوی ژووری لایڤ بنووسە">

 <button onclick="joinCall()">▶ بەشداری لایڤ</button>
 <button class="red" onclick="leaveCall()">دەرچوون</button>

 <p id="status">ئامادەی پەیوەندی</p>
</div>

<div class="panel">
 <h3>📹 ڤیدیۆی تۆ</h3>
 <div id="local" class="video"></div>

 <h3>🌍 بەشداربووانی لایڤ</h3>
 <div id="remote"></div>

 <button class="dark" onclick="switchCamera()">🔄 گۆڕینی کامێرا</button>
 <button class="dark" onclick="toggleCamera()">📷 کامێرا</button>
 <button class="dark" onclick="toggleMic()">🎤 مایکرۆفۆن</button>
</div>

<div class="footer">
 KURD STAR © 2026
</div>
</div>

<script>
const APP_ID="3b947b82132840c6942bbfa2045eac18";

let client=null;
let localAudio=null;
let localVideo=null;
let cameraOn=true;
let micOn=true;
let cameras=[];
let currentCameraIndex=0;

async function joinCall(){
 const status=document.getElementById("status");
 const channel=document.getElementById("channel").value.trim();

 if(!document.getElementById("age").checked){
  alert("پێویستە 18 ساڵ یان زیاتر بیت.");
  return;
 }
 if(client){
  alert("پێشتر بەشداری چەناڵت کردووە.");
  return;
 }
 if(!channel){
  alert("ناوی ژووری لایڤ بنووسە.");
  return;
 }

 try{
  status.innerText="پەیوەندی دروست دەکرێت...";

  if(typeof AgoraRTC==="undefined"){
   throw new Error("Agora SDK بار نەبوو.");
  }

  client=AgoraRTC.createClient({mode:"rtc",codec:"vp8"});

  client.on("user-published",async(user,type)=>{
   try{
    await client.subscribe(user,type);

    if(type==="video"){
     let div=document.getElementById("remote-"+user.uid);
     if(!div){
      div=document.createElement("div");
      div.id="remote-"+user.uid;
      div.className="video";
      document.getElementById("remote").appendChild(div);
     }
     user.videoTrack.play(div);
    }

    if(type==="audio"){
     user.audioTrack.play();
    }
   }catch(e){
    console.error("Remote error:",e);
   }
  });

  client.on("user-left",user=>{
   const div=document.getElementById("remote-"+user.uid);
   if(div)div.remove();
  });

  const uid=Math.floor(Math.random()*100000)+1;

  status.innerText="Token وەردەگیرێت...";

  const response=await fetch(
   `https://18-live-world.vercel.app/token?channel=${encodeURIComponent(channel)}&uid=${uid}`
  );

  const data=await response.json();

  if(!response.ok||!data.token){
   throw new Error(data.error||"Token error");
  }

  await client.join(APP_ID,channel,data.token,uid);

  status.innerText="مایکرۆفۆن دروست دەکرێت...";
  localAudio=await AgoraRTC.createMicrophoneAudioTrack();

  status.innerText="کامێرا دەدۆزرێتەوە...";
  cameras=await AgoraRTC.getCameras();

  if(!cameras.length){
   throw new Error("هیچ کامێرایەک نەدۆزرایەوە.");
  }

  let rearIndex=cameras.findIndex(d=>
   /back|rear|environment|دواوە/i.test(d.label)
  );

  if(rearIndex===-1){
   rearIndex=cameras.length-1;
  }

  currentCameraIndex=rearIndex;

  localVideo=await AgoraRTC.createCameraVideoTrack({
   cameraId:cameras[currentCameraIndex].deviceId,
   encoderConfig:"480p_1",
   optimizationMode:"motion"
  });

  document.getElementById("local").innerHTML="";
  localVideo.play("local");

  status.innerText="ڤیدیۆ و دەنگ بڵاودەکرێنەوە...";
  await client.publish([localAudio,localVideo]);

  cameraOn=true;
  micOn=true;

  status.innerText="⭐ بە سەرکەوتوویی چوویتە ناو لایڤ";

 }catch(e){
  console.error("JOIN ERROR:",e);
  const msg=e.message||String(e);

  if(localAudio){localAudio.close();localAudio=null;}
  if(localVideo){localVideo.close();localVideo=null;}

  if(client){
   try{await client.leave();}catch(x){}
   client=null;
  }

  document.getElementById("local").innerHTML="";
  status.innerText="هەڵە: "+msg;
  alert("هەڵە: "+msg);
 }
}

async function switchCamera(){
 try{
  if(!localVideo){
   alert("سەرەتا بچۆ ناو ژووری لایڤ.");
   return;
  }

  if(cameras.length<2){
   alert("تەنها یەک کامێرا دۆزرایەوە.");
   return;
  }

  const nextIndex=(currentCameraIndex+1)%cameras.length;

  document.getElementById("status").innerText="کامێرا دەگۆڕدرێت...";

  await localVideo.setDevice(cameras[nextIndex].deviceId);

  currentCameraIndex=nextIndex;

  document.getElementById("status").innerText="کامێرا گۆڕدرا.";

 }catch(e){
  alert("نەتوانرا کامێرا بگۆڕدرێت: "+e.message);
 }
}

async function leaveCall(){
 if(localAudio){localAudio.close();localAudio=null;}
 if(localVideo){localVideo.close();localVideo=null;}

 if(client){
  try{await client.leave();}catch(e){}
  client=null;
 }

 cameras=[];
 currentCameraIndex=0;

 document.getElementById("local").innerHTML="";
 document.getElementById("remote").innerHTML="";
 document.getElementById("status").innerText="دەرچوویت لە لایڤ.";
}

async function toggleCamera(){
 try{
  if(localVideo){
   cameraOn=!cameraOn;
   await localVideo.setEnabled(cameraOn);
  }else{
   alert("سەرەتا بچۆ ناو ژووری لایڤ.");
  }
 }catch(e){
  alert("هەڵەی کامێرا: "+e.message);
 }
}

async function toggleMic(){
 try{
  if(localAudio){
   micOn=!micOn;
   await localAudio.setEnabled(micOn);
  }else{
   alert("سەرەتا بچۆ ناو ژووری لایڤ.");
  }
 }catch(e){
  alert("هەڵەی مایکرۆفۆن: "+e.message);
 }
}
</script>
</body>
</html>
