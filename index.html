<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KURDORA — یاری و ڤیدیۆ</title>
<script src="https://download.agora.io/sdk/release/AgoraRTC_N-4.24.8.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* KURDORA — premium mobile app redesign */
:root{
 --bg:#080914;--panel:#121426;--panel2:#1a1d33;--ink:#f7f7ff;
 --muted:#a9abc2;--violet:#8b5cf6;--cyan:#39d5e8;--pink:#ff4fa3;
 --gold:#f5c96a;--line:rgba(177,164,255,.18);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;background:var(--bg)}
body{
 margin:0;padding:0;min-height:100vh;color:var(--ink);
 background:
 radial-gradient(ellipse at 15% -10%,rgba(125,75,230,.28),transparent 38%),
 radial-gradient(ellipse at 100% 35%,rgba(25,184,210,.10),transparent 35%),
 linear-gradient(180deg,#0b0c1a,#070811 68%);
 font-family:Arial,"Noto Sans Arabic",sans-serif;text-align:initial;
}
.container{max-width:620px;margin:0 auto;padding:0 0 92px}
.app-header{
 position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;
 gap:12px;padding:12px 16px;background:rgba(8,9,20,.88);backdrop-filter:blur(18px);
 border-bottom:1px solid var(--line)
}
.brand-mark{display:flex;align-items:center;gap:10px;min-width:0}
.brand-icon{
 width:42px;height:42px;border-radius:15px;display:grid;place-items:center;font-size:23px;
 color:#fff;background:linear-gradient(140deg,var(--violet),#3e8fe9 58%,var(--cyan));
 box-shadow:0 6px 24px rgba(112,83,255,.34)
}
.brand-copy h1{margin:0;font-size:21px;letter-spacing:1.5px;color:#fff}
.brand-copy p{margin:2px 0 0;color:var(--muted);font-size:11px}
.header-actions{display:flex;align-items:center;gap:7px}
.header-actions select{
 width:auto;max-width:138px;min-height:39px;margin:0;padding:8px 10px;border:1px solid var(--line);
 border-radius:12px;background:#17192b;color:#fff;font-size:12px
}
.icon-button,.nav-button,.action-button{
 border:1px solid var(--line);color:#fff;background:rgba(255,255,255,.07);
 box-shadow:none;cursor:pointer
}
.icon-button{width:39px;height:39px;padding:0;border-radius:13px;font-size:18px}
.app-page{padding:12px 12px 18px}
.app-page.hidden{display:none!important}
.section-topline{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:8px 3px 16px}
.section-topline h2{margin:0;color:#fff;font-size:21px}
.section-topline p{margin:4px 0 0;color:var(--muted);font-size:12px}
.pill-label{font-size:11px;font-weight:800;padding:6px 10px;border-radius:30px;color:#e9dcff;background:rgba(139,92,246,.18);border:1px solid rgba(172,143,255,.24)}
.panel{
 margin:12px 0;padding:17px;border-radius:22px;border:1px solid var(--line);
 background:linear-gradient(145deg,rgba(26,28,50,.96),rgba(15,16,30,.97));
 box-shadow:0 12px 34px rgba(0,0,0,.22)
}
.panel h2,.panel h3{color:#fff}
#gamesHub{border:0;background:transparent;box-shadow:none;padding:8px 2px}
.games-banner{
 padding:22px 18px;border-radius:24px;margin-bottom:16px;overflow:hidden;position:relative;
 background:linear-gradient(125deg,#4930a5,#28245e 52%,#116c83);
 box-shadow:0 14px 35px rgba(70,52,160,.25)
}
.games-banner:after{content:"🎮";position:absolute;left:12px;bottom:-20px;font-size:88px;opacity:.14;transform:rotate(-15deg)}
.games-banner h2{font-size:25px;margin:0 0 6px;color:white}
.games-banner p{margin:0;color:#e3e3ff;font-size:13px;line-height:1.7;max-width:78%}
.hub-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.hub-grid.concan-only{grid-template-columns:minmax(0,560px);justify-content:center}
.hub-grid.concan-only .hub-card{min-height:210px}
.hub-card{
 min-height:148px;padding:16px 13px;border-radius:20px;border:1px solid var(--line);
 background:linear-gradient(150deg,#1c2039,#111322);display:flex;flex-direction:column;
 align-items:flex-start;gap:8px;box-shadow:0 8px 20px #0003
}
.hub-card strong{font-size:16px;color:#fff}
.hub-card span{font-size:12px;color:var(--muted);line-height:1.6;flex:1}
.hub-card button{width:100%;margin:0;padding:9px 8px;border-radius:12px;background:rgba(139,92,246,.17);
 color:#e8ddff;border:1px solid rgba(165,139,255,.25);box-shadow:none;font-size:12px}
.small,.section-kicker{color:var(--muted);font-size:12px;line-height:1.7}
.unified-hub{padding:0!important;margin:0!important;background:transparent!important;border:0!important;box-shadow:none!important}
.unified-heading{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:5px 4px 10px}
.unified-heading h2{font-size:18px;margin:0;color:white}
.unified-heading p{display:none}
.feed-tabs{display:flex;justify-content:center;gap:22px;margin:5px 0 12px}
.feed-tabs span{font-size:13px;color:#b8b9cc;padding:7px 3px}
.feed-tabs .selected{color:#fff;font-weight:800;border-bottom:2px solid var(--cyan)}
.upload-drawer{
 margin:10px 0;padding:12px 14px;border:1px solid var(--line);border-radius:16px;
 background:linear-gradient(110deg,rgba(139,92,246,.16),rgba(57,213,232,.08))
}
.upload-drawer summary{cursor:pointer;color:#e9e4ff;font-size:13px;font-weight:800;list-style:none}
.upload-drawer summary:before{content:"＋";display:inline-grid;place-items:center;width:24px;height:24px;
 margin-left:8px;border-radius:9px;background:var(--violet);color:#fff}
input[type=text],input[type=email],input[type=password],input[type=tel],textarea,select{
 width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);
 background:#0b0d1b;color:#fff;font-size:15px;margin:7px 0
}
input[type=file]{width:100%;padding:11px;background:#0b0d1b;color:#fff;border:1px solid var(--line);border-radius:12px;margin:8px 0}
input:focus,textarea:focus,select:focus{outline:2px solid rgba(139,92,246,.35);border-color:var(--violet)}
button{
 padding:11px 15px;margin:5px 2px;border:0;border-radius:13px;
 background:linear-gradient(135deg,#9a70ff,#6950d8);color:#fff;font-size:14px;font-weight:800;
 box-shadow:0 7px 18px rgba(106,79,210,.22);cursor:pointer;transition:transform .16s,filter .16s
}
button:active{transform:scale(.97)}
button.dark{background:rgba(255,255,255,.08);color:#e9e8ff;border:1px solid var(--line);box-shadow:none}
button.red{background:linear-gradient(135deg,#ff527d,#c62b57);color:#fff}
button:disabled{opacity:.5}
#status,#authStatus,#uploadStatus,#profileStatus{color:#b9f5ff;overflow-wrap:anywhere;font-size:12px}
.live-inline{
 margin:12px 0;padding:13px 14px;border:1px solid rgba(255,79,163,.25);border-radius:17px;
 background:linear-gradient(110deg,rgba(255,79,163,.12),rgba(139,92,246,.12));text-align:right
}
.live-inline-title{display:flex;align-items:center;gap:9px;color:#fff}
.live-dot{width:9px;height:9px;background:#ff456e;border-radius:50%;box-shadow:0 0 12px #ff456e;display:inline-block}
.live-inline p{color:#c7c7dc;line-height:1.6;font-size:12px;margin:7px 0}
.live-actions{display:flex;flex-wrap:wrap;justify-content:center;gap:5px}
.live-stage{display:grid;grid-template-columns:1fr;gap:10px}
.live-stage h3{font-size:14px;margin:8px 0}
.video{width:100%;height:220px;margin-top:10px;background:#050509;border:1px solid var(--line);border-radius:15px;overflow:hidden;position:relative}
.video video{width:100%!important;height:100%!important;object-fit:cover!important}
.feed-toolbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:10px 2px}
.feed-toolbar h3{margin:0;color:#fff;font-size:15px}
.feed-toolbar button{font-size:11px;padding:8px 10px}
.reels-feed{display:flex;flex-direction:column;gap:12px;scroll-snap-type:y mandatory;max-height:none;overflow-y:visible;padding:0 1px 12px}
.feed-card{
 position:relative;min-height:72svh;height:72svh;max-height:790px;margin:0;padding:0;
 border:1px solid rgba(255,255,255,.10);border-radius:23px;overflow:hidden;background:#050509;
 scroll-snap-align:start;display:flex;flex-direction:column;justify-content:flex-end;isolation:isolate
}
.feed-card video{position:absolute;inset:0;width:100%;height:100%;max-height:none;object-fit:cover;background:#000;border-radius:0;z-index:-2}
.feed-card:before{content:"";position:absolute;inset:42% 0 0;background:linear-gradient(transparent,rgba(0,0,0,.82));pointer-events:none;z-index:-1}
.feed-card:after{content:"";position:absolute;inset:0;border-radius:23px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);pointer-events:none}
.feed-author{position:relative;z-index:1;padding:0 16px 5px;color:#fff;text-align:right;font-weight:800;font-size:14px;text-shadow:0 2px 8px #000}
.feed-caption{position:relative;z-index:1;padding:5px 16px 18px;margin:0;color:#fff;text-align:right;text-shadow:0 1px 5px #000;line-height:1.7;font-size:13px}
.feed-actions{
 position:absolute;z-index:3;left:12px;bottom:74px;display:flex;flex-direction:column;gap:15px;align-items:center
}
.feed-action{display:flex;flex-direction:column;align-items:center;gap:3px;color:#fff;font-size:11px;text-shadow:0 2px 5px #000}
.feed-action b{font-size:25px;line-height:1.1}
.feed-action.like-active b{color:#ff4f85}
.comments-modal{position:fixed;inset:0;z-index:120;background:rgba(0,0,0,.76);backdrop-filter:blur(9px);display:flex;align-items:flex-end;justify-content:center;padding:12px}
.comments-sheet{width:min(620px,100%);max-height:78svh;display:flex;flex-direction:column;background:#111326;border:1px solid var(--line);border-radius:22px;padding:14px;box-shadow:0 18px 60px #000b}
.comments-head{display:flex;align-items:center;justify-content:space-between;gap:10px;color:#fff;font-weight:800;padding-bottom:10px;border-bottom:1px solid var(--line)}
.comments-close{background:rgba(255,255,255,.08);color:#fff;border:1px solid var(--line);padding:7px 12px;box-shadow:none}
.comments-list{overflow:auto;min-height:100px;padding:8px 2px;display:flex;flex-direction:column;gap:9px}
.comment-item{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:12px;padding:9px 11px;color:#eee;text-align:right;overflow-wrap:anywhere}
.comment-meta{font-size:10px;color:#9fa3bd;margin-bottom:4px}
.comment-content{font-size:13px;line-height:1.7;white-space:pre-wrap}
.comment-form{display:flex;gap:8px;align-items:flex-end;padding-top:9px;border-top:1px solid var(--line)}
.comment-form textarea{flex:1;min-width:0;min-height:44px;max-height:100px;resize:vertical;border:1px solid var(--line);border-radius:12px;background:#080a18;color:#fff;padding:10px;font:inherit}
.comment-form button{white-space:nowrap;margin:0;padding:11px 14px}
.bottom-nav{
 position:fixed;z-index:60;bottom:0;left:50%;transform:translateX(-50%);width:min(620px,100%);
 display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:4px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));
 background:rgba(9,10,22,.94);backdrop-filter:blur(20px);border-top:1px solid var(--line)
}
.bottom-nav button{margin:0;padding:8px 3px;border-radius:13px;background:transparent;color:#85879f;box-shadow:none;font-size:11px}
.bottom-nav button .nav-icon{display:block;font-size:20px;margin-bottom:3px}
.bottom-nav button.active{color:#fff;background:linear-gradient(145deg,rgba(139,92,246,.25),rgba(57,213,232,.10));border:1px solid rgba(139,92,246,.25)}
.bottom-nav button.upload-main{color:#fff}
.account-modal{
 position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.72);backdrop-filter:blur(12px);
 display:flex;align-items:flex-end;justify-content:center;padding:14px
}
.account-modal.hidden{display:none!important}
.account-sheet{
 width:min(560px,100%);max-height:88svh;overflow:auto;padding:15px;border:1px solid var(--line);
 border-radius:24px 24px 18px 18px;background:#111326;box-shadow:0 20px 70px #000b
}
.account-close{float:left;background:rgba(255,255,255,.08);box-shadow:none;border:1px solid var(--line);padding:7px 12px}
#accountBox,#profileBox,#newPasswordBox{margin:12px 0}
.field-label{display:block;text-align:right;color:#c9c4e9;margin-top:7px;font-size:13px}
.phone-row{display:flex;gap:7px;align-items:center}
.phone-row select{width:42%;flex-shrink:0}
.phone-row input{width:58%}
.avatar{width:78px;height:78px;border-radius:50%;object-fit:cover;border:2px solid var(--violet);background:#080914;display:block;margin:10px auto}
.profile-note{font-size:12px;color:var(--muted);line-height:1.7}
.footer{color:#777b95;font-size:11px;padding:14px;text-align:center}
.hidden{display:none!important}
@media(min-width:700px){
 .container{max-width:620px}
 .live-stage{grid-template-columns:1fr 1fr}
 .feed-card{height:760px}
}
@media(max-width:420px){
 .hub-grid{gap:9px}.hub-card{min-height:145px;padding:13px 10px}
 .feed-card{height:72svh;min-height:500px}
 .app-header{padding:10px 12px}
}
/* TikTok-first experience */
body.auth-required{overflow:hidden}
body.auth-required .container> :not(#accountModal){visibility:hidden;pointer-events:none}
body.auth-required #accountModal{visibility:visible;pointer-events:auto;inset:0;padding:0;align-items:center;background:radial-gradient(circle at 20% 10%,#29205b,#070812 65%)}
body.auth-required .account-sheet{width:min(520px,100%);height:100%;max-height:100svh;border:0;border-radius:0;padding:22px 18px 30px;background:linear-gradient(160deg,#17152e,#090a16 70%);overflow-y:auto}
body.auth-required .account-close{display:none}
body.auth-required .account-sheet>h2{font-size:25px;margin:24px 0 8px!important}
body.auth-required #accountBox{margin-top:18px}
body.auth-required #profileBox,body.auth-required #newPasswordBox{display:none!important}
.terms-wrap{margin:14px 0;padding:13px;border:1px solid rgba(164,139,255,.24);border-radius:15px;background:rgba(255,255,255,.035)}
.terms-wrap label{display:flex;align-items:flex-start;gap:9px;color:#e8e7f5;font-size:12px;line-height:1.8;margin:8px 0}
.terms-wrap input{width:18px;height:18px;flex:0 0 18px;margin:3px 0 0;accent-color:#9a70ff}
.terms-wrap details{font-size:12px;color:#c5c2dc;line-height:1.8}
.terms-wrap summary{color:#c9baff;cursor:pointer;font-weight:800}
#unifiedHub{padding:0!important}
.unified-heading{padding:9px 14px 3px}
.feed-tabs{margin:0;padding:3px 0 8px;position:sticky;top:61px;z-index:20;background:rgba(8,9,20,.93);backdrop-filter:blur(15px)}
.upload-drawer{margin:7px 10px 10px}
.live-inline{margin:8px 10px;padding:10px 12px}
.feed-toolbar{margin:5px 12px}
.reels-feed{gap:0;padding:0 0 8px;max-height:none;overflow:visible}
.feed-card{width:100%;height:calc(100svh - 155px);min-height:540px;max-height:900px;border-radius:0;border:0;border-bottom:1px solid #ffffff18;scroll-snap-align:start}
.feed-card:after{border-radius:0}
.feed-actions{left:12px;bottom:105px;gap:18px}
.feed-action{min-width:42px}
.feed-action b{font-size:29px;text-shadow:0 2px 8px #000}
.feed-author,.feed-caption{padding-left:68px}
.bottom-nav{grid-template-columns:1fr 1fr 1fr 1fr}
@media(min-width:700px){.feed-card{height:min(820px,calc(100svh - 160px));border-radius:18px}.feed-card:after{border-radius:18px}}
@media(max-width:420px){.feed-card{height:calc(100svh - 142px);min-height:500px}.feed-tabs{top:58px}}
.follow-stats{display:flex;gap:18px;flex-wrap:wrap;margin:12px 0;color:#d9d9ee;font-size:13px}.follow-stats b{color:var(--gold)}
.feed-tabs button{border:0;background:transparent;color:var(--muted);font:inherit;padding:9px 12px;border-bottom:2px solid transparent;cursor:pointer}.feed-tabs button.selected{color:#fff;border-color:var(--gold);font-weight:700}
.user-search-panel{margin:12px 0;padding:12px;border:1px solid rgba(245,201,106,.25);border-radius:14px;background:rgba(10,12,28,.72)}.user-search-panel input{width:100%;margin-bottom:8px}.user-search-results{display:grid;gap:8px}.user-search-result{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px;border-radius:10px;background:rgba(255,255,255,.05)}.user-search-result .result-name{font-weight:700;overflow-wrap:anywhere}.save-video-button.saved{color:var(--gold)!important;border-color:var(--gold)!important}.feed-author{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.feed-author-name{font-weight:700}.follow-button{padding:6px 12px!important;border:1px solid var(--gold)!important;border-radius:18px!important;background:rgba(245,201,106,.12)!important;color:var(--gold)!important;font-size:12px!important}.follow-button.following{background:rgba(57,213,232,.12)!important;border-color:var(--cyan)!important;color:var(--cyan)!important}
</style>
</head>
<body>
<div class="container">
